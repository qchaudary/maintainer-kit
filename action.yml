name: 'MaintainerKit'
description: 'Workflow-native toolkit for issue triage, PR review readiness, repository audits, release notes, and optional AI'
author: 'Muhammad Qasim Chaudary'
inputs:
  mode:
    description: 'Execution mode: audit, health, triage, review, or release'
    required: false
    default: 'audit'
  ai:
    description: 'Enable optional AI semantic analysis. Disabled by default.'
    required: false
    default: 'false'
  github_token:
    description: 'GitHub token used for issue, pull request, and repository API access'
    required: false
    default: ${{ github.token }}
  openai_api_key:
    description: 'Optional API key used only when AI mode is explicitly enabled'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install MaintainerKit
      shell: bash
      run: pip install -e ${{ github.action_path }}
    - name: Run MaintainerKit
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        AI_FLAG=""
        if [ "${{ inputs.ai }}" = "true" ] && [ -n "${{ inputs.openai_api_key }}" ]; then
          AI_FLAG="--ai"
        fi

        if [ "${{ github.event_name }}" = "issues" ]; then
          maintainerkit triage --issue ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment $AI_FLAG
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          maintainerkit review --pr ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --comment $AI_FLAG
        else
          maintainerkit ${{ inputs.mode }} . $AI_FLAG
        fi
branding:
  icon: 'check-circle'
  color: 'blue'
