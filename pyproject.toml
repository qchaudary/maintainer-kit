[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maintainerkit"
version = "0.1.0"
description = "Open-source maintenance automation for GitHub projects: triage, PR reviews, release notes, and repository health."
readme = "README.md"
authors = [
  { name = "Muhammad Qasim Chaudary", email = "qasim.pointofit@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: Software Development :: Quality Assurance",
]
keywords = [
  "github", "maintainer", "triage", "pr-review", "release-notes",
  "automation", "health-check", "devops", "codex", "openai"
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ai = [
  "openai>=1.0.0"
]
dev = [
  "pytest>=7.0.0"
]

[project.scripts]
maintainerkit = "maintainerkit.cli:main"

[project.urls]
Homepage = "https://github.com/qchaudary/maintainer-kit"
Repository = "https://github.com/qchaudary/maintainer-kit.git"
Issues = "https://github.com/qchaudary/maintainer-kit/issues"
